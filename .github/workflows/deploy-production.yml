name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Web.config is gitignored (holds live secrets/connection strings) and kept
      # only on APPSRVS, outside the git workspace. Restore it after every fresh
      # checkout so the build has it, without ever committing it to source control.
      - name: Restore production Web.config
        shell: powershell
        run: Copy-Item -Path "E:\BrightoPublish\Web.config" -Destination "FOS.Web.UI\Web.config" -Force

      # Hardcoded path instead of microsoft/setup-msbuild@v2: vswhere reports this
      # Build Tools instance as incomplete (pending reboot on APPSRVS), even though
      # MSBuild itself works fine.
      - name: Setup MSBuild
        shell: powershell
        run: >
          Add-Content -Path $env:GITHUB_PATH
          -Value "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SaleForceApp.sln

      - name: Build and publish FOS.Web.UI
        run: >
          msbuild FOS.Web.UI\FOS.Web.UI.csproj
          "/t:Build;WebPublish"
          /p:Configuration=Release
          /p:DeployOnBuild=true
          /p:WebPublishMethod=FileSystem
          /p:PublishUrl="${{ runner.temp }}\publish"
          /p:DeleteExistingFiles=false
          /verbosity:minimal

      - name: Deploy to IIS with pre-deploy backup
        shell: powershell
        run: >
          .\.deploy\Deploy-Production.ps1
          -PublishDir "${{ runner.temp }}\publish"
          -SiteRoot "E:\BrightoPublish\BrightoPublish"
          -BackupRoot "E:\BrightoPublish\Latestbackup"
          -CommitSha "${{ github.sha }}"

      # Guarantee the live Web.config always matches the canonical secrets file
      # on APPSRVS, regardless of what MSBuild's config transform or robocopy
      # produced in the publish output.
      - name: Sync production Web.config to live site
        shell: powershell
        run: Copy-Item -Path "E:\BrightoPublish\Web.config" -Destination "E:\BrightoPublish\BrightoPublish\Web.config" -Force
