name: Server Diagnostics

on:
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: OS and memory
        shell: powershell
        run: >
          Get-ComputerInfo |
          Select-Object OsName, OsVersion, OsArchitecture, WindowsProductName,
          WindowsVersion, CsTotalPhysicalMemory, OsFreePhysicalMemory |
          Format-List

      - name: CPU
        shell: powershell
        run: >
          Get-CimInstance Win32_Processor |
          Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed |
          Format-List

      - name: GPU
        shell: powershell
        run: >
          Get-CimInstance Win32_VideoController |
          Select-Object Name, AdapterRAM, DriverVersion |
          Format-List

      - name: Network / IP
        shell: powershell
        run: >
          Get-NetIPAddress -AddressFamily IPv4 |
          Where-Object { $_.InterfaceAlias -notlike "*Loopback*" } |
          Select-Object InterfaceAlias, IPAddress, PrefixOrigin |
          Format-Table -AutoSize

      - name: Test Business Affiliate welcome SMS via CBS gateway (temporary)
        shell: powershell
        run: >
          $body = @{ BusinessName = "CBS Gateway Test"; ContactPerson = "Test Contact"; ContactNumber = "03324619571";
            AffiliateBusinessTypeID = 1; AffiliateClassificationID = 1; AffiliateExpertiseID = 1; NatureOfClientID = 1;
            SalesOfficerID = 1; RegionID = 1; CityID = 1; NoOfSites = 1; Latitude = 24.8607; Longitude = 67.0011;
            Address = "Test Address, Karachi"; Remarks = "CBS gateway re-test" } | ConvertTo-Json;
          try {
            $resp = Invoke-RestMethod -Uri "http://116.58.33.11:81/api/BusinessAffiliatesRegistration" -Method Post -Body $body -ContentType "application/json";
            $resp | ConvertTo-Json -Depth 5
          } catch {
            Write-Output "Request failed: $($_.Exception.Message)"
          }

      - name: Latest app log tail
        shell: powershell
        run: >
          $latest = Get-ChildItem "E:\BrightoPublish\BrightoPublish\Logs\*.log" -ErrorAction SilentlyContinue |
          Sort-Object LastWriteTime -Descending | Select-Object -First 1;
          if ($latest) { Write-Output "Reading: $($latest.FullName)"; Get-Content $latest.FullName -Tail 80 }
          else { Write-Output "No log files found under E:\BrightoPublish\BrightoPublish\Logs" }

      - name: Disk space
        shell: powershell
        run: >
          Get-PSDrive -PSProvider FileSystem |
          Select-Object Name, @{N='FreeGB';E={[math]::Round($_.Free/1GB,1)}},
          @{N='UsedGB';E={[math]::Round($_.Used/1GB,1)}} |
          Format-Table -AutoSize
